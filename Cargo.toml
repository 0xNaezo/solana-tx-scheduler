[package]
name = "solana-tx-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Controlled mainnet experiment: how Solana validators order transactions in their blocks"
license = "MIT"
repository = "https://github.com/0xNaezo/solana-tx-scheduler"

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
# Same QUIC stack as solana-tpu-client-next, used directly to control send order and timing.
quinn = { package = "anza-quinn", version = "=0.11.11-rustsec20260339" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
solana-address = "2.9"
solana-commitment-config = "3.1.1"
solana-compute-budget-interface = { version = "3.1.0", features = ["borsh"] }
solana-epoch-info = { version = "3.1.0", features = ["serde"] }
solana-keypair = "3.1.2"
solana-rpc-client = { version = "4.3.2", default-features = false, features = [
    "agave-unstable-api",
] }
solana-rpc-client-api = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-signer = "3.0.1"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-tls-utils = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-transaction = { version = "4.3.0", features = ["wincode"] }
spl-memo-interface = "2.1.0"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wincode = "0.6.3"
zstd = "0.13.3"
