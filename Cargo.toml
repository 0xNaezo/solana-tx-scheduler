[package]
name = "solana-tx-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
solana-commitment-config = "3.1.1"
solana-compute-budget-interface = { version = "3.1.0", features = ["borsh"] }
solana-keypair = "3.1.2"
solana-pubkey = "4.4.0"
solana-rpc-client = { version = "4.3.2", default-features = false, features = ["agave-unstable-api"] }
solana-rpc-client-api = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-signer = "3.0.1"
solana-tpu-client-next = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-transaction = { version = "4.3.0", features = ["wincode"] }
solana-transaction-status-client-types = { version = "4.3.2", features = ["agave-unstable-api"] }
spl-memo-interface = "2.1.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
